# Local PostgreSQL for development and tests.  `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: wholesale
      POSTGRES_DB: wholesale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the restricted role the app connects as (see docs/ISOLATION.md).
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
volumes:
  pgdata:

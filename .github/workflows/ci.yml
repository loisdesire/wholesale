name: CI

# Runs the same checks documented in docs/DEPLOYMENT.md — migrate, verify tenant isolation,
# lint, typecheck, test, build — against a throwaway Postgres, on every push and PR. This is
# what app/scripts/check-isolation.ts's own doc comment means by "better a failed deploy than a
# running app that quietly isolates nothing": catching it here, before merge, is cheaper than
# catching it at the instrumentation.ts startup check in a real deploy.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wholesale
          POSTGRES_PASSWORD: wholesale
          POSTGRES_DB: wholesale
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wholesale"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Mirrors docker-compose.yml's roles exactly (see docs/ISOLATION.md): DATABASE_URL is the
      # restricted role the app itself runs as, DIRECT_URL is the owner used only for migrations
      # and the seed. CI-only secret, never used anywhere real.
      DATABASE_URL: postgresql://wholesale_app:wholesale_app@localhost:5432/wholesale?schema=public
      DIRECT_URL: postgresql://wholesale:wholesale@localhost:5432/wholesale?schema=public
      TEST_DATABASE_URL: postgresql://wholesale:wholesale@localhost:5432/wholesale_test?schema=public
      TEST_APP_DATABASE_URL: postgresql://wholesale_app:wholesale_app@localhost:5432/wholesale_test?schema=public
      AUTH_SECRET: ci-only-secret-never-used-for-anything-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # docker-compose.yml's db service creates this role via docker/init-app-role.sql on first
      # boot; the GitHub-hosted Postgres service container has no such hook, so it's created here
      # instead. The dev/test database name's "_test" suffix is enforced by
      # tests/global-setup.ts itself, which refuses to run otherwise.
      - name: Create the restricted app role and the test database
        env:
          PGPASSWORD: wholesale
        run: |
          psql -h localhost -U wholesale -d wholesale -c "CREATE ROLE wholesale_app LOGIN PASSWORD 'wholesale_app' NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U wholesale -d wholesale -c "CREATE DATABASE wholesale_test OWNER wholesale;"

      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Verify tenant isolation is actually enforced
        run: npm run db:check-isolation

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
